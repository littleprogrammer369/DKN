# Apache Virtual Host — داده کشت نوین
# Deploy to: /etc/apache2/sites-available/dadeh-kesht-novin.conf

<VirtualHost *:80>
    ServerName dadehkeshtnovin.ir
    ServerAlias www.dadehkeshtnovin.ir
    ServerAdmin admin@dadehkeshtnovin.ir

    # Redirect HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName dadehkeshtnovin.ir
    ServerAlias www.dadehkeshtnovin.ir
    ServerAdmin admin@dadehkeshtnovin.ir

    # SSL (use certbot for production)
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/dadeh-kesht-novin.crt
    SSLCertificateKeyFile /etc/ssl/private/dadeh-kesht-novin.key

    # Security headers
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), camera=(), microphone=()"

    # Frontend — Next.js (port 3000)
    ProxyPreserveHost On
    ProxyPass /_next/webpack-hmr ws://localhost:3000/_next/webpack-hmr
    ProxyPassReverse /_next/webpack-hmr ws://localhost:3000/_next/webpack-hmr

    <Location />
        ProxyPass http://localhost:3000/
        ProxyPassReverse http://localhost:3000/
        Order allow,deny
        Allow from all
    </Location>

    # Backend API — NestJS (port 3001)
    <Location /api>
        ProxyPass http://localhost:3001/api
        ProxyPassReverse http://localhost:3001/api
        Order allow,deny
        Allow from all

        # CORS headers
        Header always set Access-Control-Allow-Origin "*"
        Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
        Header always set Access-Control-Allow-Headers "Content-Type, Authorization"
    </Location>

    # Static files
    <Location /icons>
        ProxyPass !
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
    </Location>

    # Gzip compression
    AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/dkn-error.log
    CustomLog ${APACHE_LOG_DIR}/dkn-access.log combined
</VirtualHost>
