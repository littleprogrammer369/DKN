# Apache VirtualHost — داده کشت نوین (DKN)
# Reverse Proxy for PM2 services

<VirtualHost *:80>
    ServerName localhost
    ServerAdmin admin@dkn.local

    # ─── Security Headers ─────────────────────────────────
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # ─── Gzip / Deflate ──────────────────────────────────
    AddOutputFilterByType DEFLATE text/html text/plain text/css application/json application/javascript text/xml application/xml text/javascript

    # ─── Cache Static Assets ─────────────────────────────
    ExpiresActive On
    ExpiresByType image/png "access plus 1 month"
    ExpiresByType image/jpg "access plus 1 month"
    ExpiresByType image/webp "access plus 1 month"
    ExpiresByType text/css "access plus 1 week"
    ExpiresByType application/javascript "access plus 1 week"
    ExpiresByType text/javascript "access plus 1 week"

    # ─── Logs ────────────────────────────────────────────
    ErrorLog ${APACHE_LOG_DIR}/dkn-error.log
    CustomLog ${APACHE_LOG_DIR}/dkn-access.log combined

    # ─── Frontend (Next.js) ──────────────────────────────
    ProxyPreserveHost On
    ProxyRequests Off

    <Location />
        ProxyPass http://127.0.0.1:3000/
        ProxyPassReverse http://127.0.0.1:3000/
    </Location>

    # ─── Backend API ─────────────────────────────────────
    <Location /api/>
        ProxyPass http://127.0.0.1:3001/api/
        ProxyPassReverse http://127.0.0.1:3001/api/
    </Location>

    # ─── WebSocket Support ───────────────────────────────
    <Location /ws>
        ProxyPass ws://127.0.0.1:3001/ws
        ProxyPassReverse ws://127.0.0.1:3001/ws
    </Location>

    # ─── Rewrites ────────────────────────────────────────
    RewriteEngine On

    # Redirect all non-existing static files to Next.js (SPA fallback)
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_URI} !^/api/
    RewriteRule ^(.*)$ http://127.0.0.1:3000/$1 [P,L]
</VirtualHost>
