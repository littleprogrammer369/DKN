# Apache Virtual Host — داده کشت نوین (HTTP Only)
# Serve on port 80 without domain

<VirtualHost *:80>
    ServerAdmin admin@dadehkeshtnovin.ir
    ServerName _default_

    # Security headers
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"

    # Frontend — Next.js (port 3000)
    ProxyPreserveHost On
    ProxyRequests Off

    <Location />
        ProxyPass http://localhost:3000/
        ProxyPassReverse http://localhost:3000/
    </Location>

    # Backend API — NestJS (port 3001)
    <Location /api>
        ProxyPass http://localhost:3001/api
        ProxyPassReverse http://localhost:3001/api

        # CORS headers
        Header always set Access-Control-Allow-Origin "*"
        Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
        Header always set Access-Control-Allow-Headers "Content-Type, Authorization"
    </Location>

    # Gzip compression
    AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/dkn-error.log
    CustomLog ${APACHE_LOG_DIR}/dkn-access.log combined
</VirtualHost>
